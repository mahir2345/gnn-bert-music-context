# =========================================================
# Global configuration for gnn-bert-music-context
# =========================================================

seed: 42
device: "cuda"          # falls back to cpu automatically if unavailable

# ---------------------------------------------------------
# Data paths
# ---------------------------------------------------------
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"

  # Choose ONE audio source and ONE text source (see README for download links)
  audio_dataset: "gtzan"          # options: gtzan | fma_small | fma_medium | magnatagatune
  text_dataset: "audio_derived_captions"  # generated by preprocess.py from audio only (no label leakage)

  sample_rate: 22050
  n_mels: 128
  n_chroma: 12
  mel_time_pool: 4                # average-pool mel time axis by this factor (float16 on disk)
  segment_seconds: 3.0            # window length for segmentation (overlapping)
  segment_hop_seconds: 1.5        # 50% overlap -> ~19 nodes per 30s clip
  similarity_threshold: 0.5       # cosine sim threshold (tau) on STANDARDIZED segment features
  max_similarity_neighbors: 3     # cap similarity edges per node (keeps graph sparse)

# ---------------------------------------------------------
# Text / BERT settings
# ---------------------------------------------------------
text:
  model_name: "distilbert-base-uncased"   # swap to "bert-base-uncased" if you have more compute
  max_length: 128
  top_k_tags: 50                          # for MagnaTagATune subset (Task 1 baseline)

# ---------------------------------------------------------
# GNN settings
# ---------------------------------------------------------
gnn:
  architecture: "graphsage"       # options: graphsage | gat
  hidden_dim: 128
  out_dim: 128
  num_layers: 3
  dropout: 0.3
  gat_heads: 4                    # only used if architecture == gat

# ---------------------------------------------------------
# Fusion settings (Task 3)
# ---------------------------------------------------------
fusion:
  type: "cross_attention"         # options: concat | cross_attention
  hidden_dim: 256
  num_heads: 4
  emotion_loss_weight_valence: 0.5   # alpha
  emotion_loss_weight_arousal: 0.5   # beta

# ---------------------------------------------------------
# Contrastive settings (Task 4)
# ---------------------------------------------------------
contrastive:
  temperature: 0.07
  embed_dim: 256
  batch_size: 64

# ---------------------------------------------------------
# Training
# ---------------------------------------------------------
train:
  epochs: 30
  batch_size: 32
  learning_rate: 0.0002
  weight_decay: 0.00001
  early_stopping_patience: 5
  bert_finetune: false            # set true only in later epochs / if you have GPU budget
  log_every_n_steps: 20

# ---------------------------------------------------------
# Evaluation
# ---------------------------------------------------------
eval:
  metrics: ["macro_f1", "micro_f1", "auc_pr"]
  emotion_metrics: ["mae", "r2"]
  retrieval_k: [1, 5, 10]
